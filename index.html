<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Picture This!</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <div class="title">
      <h1>Picture This!</h1>
      <h4>My Really Cool Blog Post</h4>
    </div>
<picture>
  <!-- AI Prompt: Responsive picture element / Intent: Optimize images for different screen sizes -->

  <!-- Larger image for wide screens -->
  <source media="(min-width: 960px)" srcset="images/museum-960x.jpg 1x, images/museum-1600x.jpg 2x, images/museum-1920x.jpg 3x">

  <!-- Default image for smaller screens -->
  <img src="images/museum-480x.jpg" alt="Museum view" width="480" height="270">
</picture>
  </header>
</body>

</html>
